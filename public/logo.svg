<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px"
	 viewBox="0 0 30 30" style="enable-background:new 0 0 30 30;" xml:space="preserve">
<defs>
  <style type="text/css">
    .st194{fill:#2D2D2D;stroke:#FFFFFF;stroke-width:0.6317;stroke-miterlimit:10;}
    .st23{fill:#FFFFFF;}

    .z-breathe {
      animation: breathe 2.5s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
  </style>
</defs>

<g>
  <!-- Fondo del contenedor original -->
  <path class="st194" d="M24.51,28.51H5.49c-2.21,0-4-1.79-4-4V5.49c0-2.21,1.79-4,4-4h19.03c2.21,0,4,1.79,4,4v19.03
    C28.51,26.72,26.72,28.51,24.51,28.51z"/>
  
  <!-- Icono del gorro de graduación con el efecto de respiración original -->
  <g class="z-breathe">
    <!-- Birrete (Rombo superior) -->
    <polygon class="st23" points="15,6.5 25,11.5 15,16.5 5,11.5"/>
    
    <!-- Casquete inferior (Base del gorro) -->
    <path class="st23" d="M9,14.2 v3 c0,2 3,3.5 6,3.5 s6,-1.5 6,-3.5 v-3 L15,17 Z"/>
    
    <!-- Borla / Cordon -->
    <path class="st23" d="M15,11.5 L19.5,14.5 v3.5 h1 v-4 Z"/>
  </g>
</g>
</svg>